name: CI and Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Lint, type-check, and test on every push and PR, across platforms.
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: Cache dependencies
        run: deno cache --allow-scripts=npm:esbuild@0.20.2 src/index.ts

      - name: Lint
        run: deno lint

      - name: Type check
        run: deno check "src/**/*.ts"

      - name: Test
        run: deno test --allow-all

  # Verify the dnt (Deno -> Node) build and the generated npm package's tests
  # on every push and PR, so publishing can't be the first time the build runs.
  build-npm:
    name: Build npm package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: Cache dependencies
        run: deno cache --allow-scripts=npm:esbuild@0.20.2 src/index.ts

      - name: Install build dependencies
        run: npm install jsonld @types/jsonld

      - name: Get version from package.json
        id: get_version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build npm package
        run: deno run -A build_npm.ts ${{ steps.get_version.outputs.VERSION }}

      - name: Run npm package tests
        run: npm ci && npm test
        working-directory: npm

  # Open/update the release PR on pushes to main; sets release_created=true
  # on the push where a release PR is merged.
  release-please:
    name: Release Please
    needs: [test, build-npm]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: google-github-actions/release-please-action@v3
        id: release
        with:
          release-type: node
          default-branch: main
          package-name: psychds-validator
          path: .
          token: ${{ secrets.GITHUB_TOKEN }}

  # Build and publish to npm only when release-please actually cut a release.
  publish:
    name: Publish to npm
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: Cache dependencies
        run: deno cache --allow-scripts=npm:esbuild@0.20.2 src/index.ts

      - name: Install build dependencies
        run: npm install jsonld @types/jsonld

      - name: Get version from package.json
        id: get_version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build npm package
        run: deno run -A build_npm.ts ${{ steps.get_version.outputs.VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npm
        run: npm publish
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
